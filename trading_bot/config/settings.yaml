# DEI-TB settings. Secrets (DELTA_API_KEY / DELTA_API_SECRET) are never stored here:
# they are read from the environment only.

# SIGNAL_ONLY | PAPER | LIVE. SIGNAL_ONLY never places orders.
mode: SIGNAL_ONLY

# Global kill switch. Trading is allowed only when this is true AND the environment
# variable TRADING_ENABLED is exactly "true". Anything else means no orders.
trading_enabled: false

# Research focus, chosen from the Phase 2 data-quality report. DOGEUSD is the volatile leg:
# 1000PEPEUSD, MONUSD, PNUTUSD and ZROUSD trade 186-426 times a day with 80-90% of minutes
# empty, too thin for systematic research without an order book.
symbols:
  - BTCUSD
  - ETHUSD
  - SOLUSD
  - DOGEUSD

# Research timeframes, in the order they will be studied (cheapest Kronos cost first).
timeframes: [1h, 15m, 4h, 5m, 1m]

data:
  # Root for normalised local data (Parquet). Raw files stay wherever you keep them.
  root: ./data_store

kronos:
  # Kronos-mini: 4.1M params, context 2048. Kronos-small: 24.7M, context 512.
  # Kronos-base (102M) runs on a 4 GB GTX 1650 for inference but is slow; fine-tune small/mini.
  model_id: NeoQuasar/Kronos-small
  tokenizer_id: NeoQuasar/Kronos-Tokenizer-base
  max_context: 512
  lookback: 400
  device: auto          # auto | cpu | cuda | cuda:0 | mps
  n_samples: 16
  temperature: 1.0
  top_p: 0.9
  top_k: 0
  clip: 5.0
  # Kronos pretraining corpus ends June 2024: data before this date may be in-sample for Kronos.
  # Kronos test windows must start after it.
  pretrain_cutoff: "2024-06-30"

costs:
  # Delta India perpetuals, before GST. [verify against your account tier]
  taker_fee: 0.0005
  maker_fee: 0.0002
  gst_rate: 0.18
  # No funding history in the data yet: 1 bp per 8h charged to every position, either side.
  funding_assumed_per_8h: 0.0001

research:
  # Data: 2026-01-01 -> 2026-09-01 (all after the Kronos pretraining cutoff).
  data_start: "2026-01-01"
  first_test_month: "2026-03"   # dev folds test Mar, Apr, May, Jun (expanding train, 1-month validation)
  holdout_start: "2026-07-01"   # Jul 1 -> Sep 1 is the final holdout: locked, evaluated once
  data_end: "2026-09-02"
  val_months: 1
  embargo: "12h"                # gap between train/val/test on top of label purging
  horizons: [1, 3, 6, 12, 24]   # in bars of each timeframe
  triple_barrier_k: 1.0         # barrier half-width = max(k * sigma * sqrt(h), round-trip cost)
  vol_window: 48
